</style></head><body><main><h1>KO CARD GAME · 월넛 재질만 교체</h1><p>동일 카드·게임 상태·화면 크기 / 천·HUD·손패 그대로 / 운영 배포 없음</p><label>뷰포트 <select id="size"><option>390x844</option><option>360x740</option><option>375x812</option><option>412x915</option><option>1440x1000</option></select></label><div class="compare"><figure><figcaption>수정 전 · 단순 벡터 나무</figcaption><a id="beforeLink"><img id="before" alt="수정 전 같은 게임 상태"></a></figure><figure><figcaption>수정 후 · 별도 다크 월넛 이미지</figcaption><a id="afterLink"><img id="after" alt="나무 재질만 교체한 실제 전투 화면"></a></figure></div><p>원본 크기로 보려면 이미지를 눌러. 나무만 바꿨고 모든 전투 UI의 좌표와 카드 크기는 같아. 이미지에는 전체 스크롤 영역이 포함되어 있어.</p><nav><a href="README.md">수정·검증 보고서</a></nav></main><script>function show(){for(const key of ['before','after']){const file=key+'-'+document.getElementById('size').value+'.png';document.getElementById(key).src=file;document.getElementById(key+'Link').href=file}}document.getElementById('size').onchange=show;show();</script></body></html>
