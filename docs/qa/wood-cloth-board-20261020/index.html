</style></head><body><main><h1>KO CARD GAME · DARK WOOD × LINEN</h1><p>실제 공유 전투 UI · 동일 게임 상태 비교 · 운영 배포 없음</p><label>뷰포트 <select id="size"><option>390x844</option><option>360x740</option><option>375x812</option><option>412x915</option><option>1440x1000</option></select></label><div class="compare"><figure><figcaption>기존 전투 보드</figcaption><a id="classicLink"><img id="classic" alt="동일 상태의 기존 보드"></a></figure><figure><figcaption>다크 우드 + 베이지 천</figcaption><a id="newLink"><img id="new" alt="동일 상태의 우드와 천 보드"></a></figure></div><p>카드 자체 크기는 동일해. 이미지는 전체 스크롤 영역 캡처야. 짧은 화면에서는 카드 축소 대신 세로 스크롤을 사용해. 실제 휴대폰 검증은 미실행이야.</p><nav><a href="empty-390x844.png">빈 전장</a><a href="ability-emotes-390x844.png">능력·감정표현</a><a href="pvp-a.png">로컬 PvP</a><a href="draft.png">드래프트</a><a href="tower.png">타워</a><a href="README.md">구현·검증 보고서</a></nav></main><script>function show(){for(const key of ['classic','new']){const file=key+'-'+document.getElementById('size').value+'.png';document.getElementById(key).src=file;document.getElementById(key+'Link').href=file}}document.getElementById('size').onchange=show;show();</script></body></html>
