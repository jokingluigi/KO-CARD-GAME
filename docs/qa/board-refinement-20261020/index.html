*{box-sizing:border-box}body{margin:0;background:#241713;color:#f0e8d8;font:16px/1.5 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:20px}h1{font-size:22px;margin:0 0 8px}p{margin:8px 0;color:#d8c2a1}select,a{color:#d9bb7b;background:#121317;border:1px solid #b99a60;padding:10px}a{display:inline-block;text-decoration:none}.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}figure{margin:0;min-width:0}figcaption{margin-bottom:8px;color:#d9bb7b}.compare a{display:block;padding:0;border:0;background:transparent}img{display:block;width:100%;height:auto;border:0}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:600px){main{padding:12px}.compare{gap:8px}figcaption{font-size:13px}}
</style></head><body><main><h1>KO CARD GAME · 전투 보드 보정</h1><p>동일 카드·상태·뷰포트 / 카드 크기와 전체 배치 유지 / 운영 배포 없음</p><label>뷰포트 <select id="size"><option>390x844</option><option>360x740</option><option>375x812</option><option>412x915</option><option>1440x1000</option></select></label><div class="compare"><figure><figcaption>수정 전 우드·천 보드</figcaption><a id="beforeLink"><img id="before" alt="수정 전 동일 상태의 보드"></a></figure><figure><figcaption>수정 후 · 검정 바탕과 재질 보정</figcaption><a id="afterLink"><img id="after" alt="검정 카드 바탕과 개선한 재질의 실제 화면"></a></figure></div><p>손패만 8px 위로 이동했어. 짧은 화면은 카드 축소 대신 기존 세로 스크롤을 유지해. 전체 스크롤 영역 캡처이며 실제 휴대폰 검사는 미실행이야.</p><nav><a href="selected-hand-390x844.png">선택된 손패</a><a href="ability-emotes-390x844.png">능력·감정표현</a><a href="pvp-a.png">로컬 PvP</a><a href="draft.png">드래프트</a><a href="tower.png">타워</a><a href="README.md">수정·검증 보고서</a></nav></main><script>function show(){for(const key of ['before','after']){const file=key+'-'+document.getElementById('size').value+'.png';document.getElementById(key).src=file;document.getElementById(key+'Link').href=file}}document.getElementById('size').onchange=show;show();</script></body></html>
