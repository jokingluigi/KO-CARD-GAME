<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>연결 필요 · KO CARD GAME</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100dvh; display: grid; place-items: center; margin: 0; padding: 24px; color: #f5f5f5; background: #0a0a0a; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
      main { max-width: 350px; }
      h1 { color: #fbbf24; font-size: 30px; margin: 0 0 12px; }
      p { color: #d4d4d4; margin: 0 0 26px; }
      button { min-height: 48px; padding: 10px 30px; border: 0; border-radius: 9px; color: #141414; background: #fbbf24; font-size: 16px; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>KO CARD GAME</h1>
      <p>게임 서버에 연결할 수 없습니다. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.</p>
      <form method="get"><button type="submit">다시 연결</button></form>
    </main>
  </body>
</html>
