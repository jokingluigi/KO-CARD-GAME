name: Production release safety
on:
  push:
    branches: [production]
  pull_request:
    paths:
      - scripts/deploy/**
      - artifacts/ko-game/vite.config.ts
      - artifacts/api-server/src/routes/health.ts
      - .github/workflows/release-safety.yml
permissions:
  contents: read
jobs:
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/deploy/verify-release.test.mjs
      - run: node scripts/deploy/verify-release.mjs --minimum-commit ce5568d955171b32719b24cabb2c7937b8da165f
