name: Startup and awakening registration
on:
  pull_request:
    paths:
      - lib/game-engine/src/tower/**
      - lib/db/qa/tower*
      - lib/db/migrations/0051_tower_v2_versions.sql
      - artifacts/api-server/src/lib/tower*
      - artifacts/api-server/src/routes/*tower*
      - artifacts/ko-game/**
      - docs/qa/current-card-engine.mjs
      - docs/qa/entry-browser.mjs
      - docs/qa/art-direction-browser.mjs
      - artifacts/ko-game/src/game/**
      - artifacts/ko-game/src/components/*animation*
      - artifacts/ko-game/src/components/battle-vfx*
      - artifacts/ko-game/src/components/presentation-*
      - artifacts/ko-game/src/components/quest-presentation.tsx
      - artifacts/ko-game/src/components/game-state-preview.tsx
      - artifacts/ko-game/src/battle-presentation.css
      - artifacts/ko-game/src/main.tsx
      - artifacts/ko-game/src/components/admin-card-manager.tsx
      - artifacts/ko-game/src/components/alt-inspector-utils.ts
      - artifacts/ko-game/src/components/alt-inspector.tsx
      - artifacts/ko-game/src/components/card-rules-text.tsx
      - artifacts/ko-game/src/components/card-detail-dialog.tsx
      - artifacts/ko-game/src/components/ui/dialog.tsx
      - artifacts/ko-game/src/pages/decks.tsx
      - artifacts/ko-game/src/pages/home.tsx
      - artifacts/ko-game/src/components/match-result-overlay.tsx
      - artifacts/ko-game/src/index.css
      - docs/qa/champion-features-browser.mjs
      - docs/qa/admin-console*browser.mjs
      - docs/qa/mobile-spell-drag-browser.mjs
      - docs/qa/quest-completion-features*.mjs
      - docs/qa/daily-quests-browser.mjs
      - artifacts/api-server/src/lib/daily-quest-service*
      - artifacts/api-server/src/lib/ai-quest-match-storage.ts
      - artifacts/api-server/src/lib/startup-schema.ts
      - artifacts/api-server/src/routes/admin-rewards.ts
      - lib/db/src/schema/rewards.ts
      - lib/db/migrations/0038_ai_quest_matches.sql
      - artifacts/api-server/src/lib/auth.ts
      - artifacts/api-server/src/routes/auth.ts
      - lib/db/src/index.ts
      - artifacts/api-server/src/app.ts
      - artifacts/api-server/src/lib/request-body*
      - artifacts/api-server/src/routes/daily-quests.ts
      - docs/qa/mobile-history-browser.mjs
      - docs/qa/battle-card-info-portraits-browser.mjs
      - docs/qa/latest-wrestler-revisions-browser.mjs
      - docs/qa/snapshots/20261015-wrestler-revisions/**
      - lib/game-engine/tsconfig.json
      - docs/qa/field-attack-drag-browser.mjs
      - docs/qa/mobile-deck-controls-browser.mjs
      - artifacts/api-server/src/lib/ai-match-quest-service*
      - artifacts/ko-game/src/lib/card-display-state.ts
      - artifacts/api-server/src/routes/admin.ts
      - artifacts/api-server/src/lib/structured-effects*
      - lib/cosmetics/**
      - lib/db/src/schema/cosmetics.ts
      - lib/db/migrations/0053_cosmetics.sql
      - lib/db/qa/cosmetics.test.ts
      - artifacts/api-server/src/lib/cosmeti*.ts
      - artifacts/api-server/src/lib/draft-cosmetics.ts
      - artifacts/api-server/src/lib/draft-service.ts
      - artifacts/api-server/src/routes/admin-draft.ts
      - lib/db/qa/draft-http.test.ts
      - artifacts/api-server/src/routes/cosmetics.ts
      - artifacts/api-server/src/online/**
      - docs/qa/cosmetics*browser*.mjs
      - lib/effect-registry/**
      - artifacts/ko-game/index.html
      - artifacts/ko-game/public/server-connection.js
      - artifacts/ko-game/src/lib/startup-client*
      - artifacts/ko-game/src/lib/auth-client*
      - artifacts/ko-game/src/components/server-maintenance.tsx
      - artifacts/ko-game/src/audio/music-route*
      - artifacts/ko-game/src/audio/audio-manager*
      - artifacts/api-server/src/lib/usage-statistics-*.ts
      - artifacts/api-server/src/routes/admin-usage-statistics.ts
      - lib/db/migrations/0052_usage_statistics.sql
      - lib/db/qa/usage-statistics.test.ts
      - docs/qa/usage-statistics-browser.mjs
      - docs/qa/admin-usage-statistics-20261016/**
      - artifacts/api-server/src/index.ts
      - artifacts/api-server/src/lib/awakening-card-service.ts
      - lib/db/qa/awakening-http.test.ts
      - .github/workflows/startup-validation.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - name: Cosmetics ownership, storage, authoritative PvP and recovery integration
        run: node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs --test --test-isolation=none lib/db/qa/cosmetics.test.ts
      - name: Independent deck codes and bounded administrator sessions
        run: >-
          node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs --test --test-isolation=none
          artifacts/ko-game/src/lib/deck-share-code.test.ts
          artifacts/ko-game/src/lib/admin-session-client.test.ts
      - name: Site-wide presence and atomic 30-second quick AI handoff
        run: |
          node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs --test --test-isolation=none artifacts/api-server/src/online/site-presence.test.ts
          node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs --test --test-isolation=none lib/db/qa/site-presence-quick-ai.test.ts
      - name: Deck import ownership and result music HTTP persistence
        run: |
          node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs --test --test-isolation=none lib/db/qa/deck-sharing-http.test.ts
          node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs --test --test-isolation=none lib/db/qa/result-music-http.test.ts
      - name: Startup, auth, quest and database regressions
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
        run: >-
          node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs --test --test-isolation=none
          artifacts/ko-game/src/lib/admin-navigation.test.ts
          artifacts/ko-game/src/lib/startup-client.test.ts
          artifacts/ko-game/src/lib/entry-state.test.ts
          artifacts/ko-game/src/lib/reward-receipt.test.ts
          artifacts/api-server/src/lib/request-body.test.ts
          artifacts/api-server/src/lib/daily-quest-service.test.ts
          artifacts/api-server/src/lib/maintenance.test.ts
          artifacts/ko-game/src/lib/auth-client.test.ts
          artifacts/ko-game/src/audio/music-route.test.ts
          artifacts/ko-game/src/audio/audio-manager.test.ts
          lib/game-engine/src/tower/domain.test.ts
          lib/game-engine/src/tower/v2.test.ts
          artifacts/ko-game/src/game/tower/relics.test.ts
          artifacts/ko-game/src/game/tower/relic-events.test.ts
          artifacts/ko-game/src/game/champions/awakening.test.ts
          artifacts/ko-game/src/game/champions/opponent-turn-quest.test.ts
          artifacts/ko-game/src/game/engine/wanted.test.ts
          artifacts/ko-game/src/game/engine/retire-destroy-semantics.test.ts
          artifacts/ko-game/src/components/battle-vfx-model.test.ts
          artifacts/ko-game/src/components/alt-inspector.test.ts
          artifacts/ko-game/src/components/alt-inspector-keyboard.test.ts
          artifacts/ko-game/src/components/alt-inspector-tags.test.ts
          artifacts/ko-game/src/components/attack-animation-utils.test.ts
          artifacts/ko-game/src/components/card-play-animation-utils.test.ts
          artifacts/ko-game/src/components/presentation-feedback-utils.test.ts
          artifacts/ko-game/src/components/presentation-policy.test.ts
          artifacts/ko-game/src/components/cinematic-policy.test.ts
          artifacts/ko-game/src/components/screen-impact-policy.test.ts
          artifacts/ko-game/src/components/presentation-event-feedback.test.ts
          artifacts/api-server/src/lib/ai-match-quest-service.test.ts
          artifacts/ko-game/src/game/qa/latest-card-text-20261007.test.ts
          lib/db/qa/awakening-http.test.ts

      - name: Daily and season quests with real ordinary-user auth and isolation
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
        run: node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs --test --test-isolation=none lib/db/qa/quest-platform-http.test.ts

      - name: Champion reward replacement, start abilities and wrestler exit dialogue
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
        run: >-
          node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs --test --test-isolation=none
          artifacts/ko-game/src/components/wrestler-event-line.test.ts
          lib/db/qa/champion-start-exit-reward-http.test.ts

      - name: Tag catalog, unlimited card tags and membership HTTP regressions
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
        run: >-
          node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs --test --test-isolation=none
          lib/db/qa/tag-management-http.test.ts artifacts/api-server/src/lib/card-tags.test.ts

      - name: Card publication transitions and administrator authorization
        run: node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs --test --test-isolation=none lib/db/qa/card-publication-http.test.ts

      - name: Seeded rare draft eligibility and HTTP regressions
        run: |
          node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs --test --test-isolation=none lib/game-engine/src/draft/domain.test.ts lib/game-engine/src/draft/mutations.test.ts
          node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs --test --test-isolation=none lib/db/qa/draft-http.test.ts
          node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs --test --test-isolation=none lib/db/qa/public-draft-access.test.ts

      - name: Tower V2 authenticated HTTP and immutable version validation
        run: node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs --test --test-isolation=none lib/db/qa/tower-v2-http.test.ts

      - name: Card and champion usage statistics database, real replay and authorization
        env:
          KO_STATS_PERF: '1'
        run: node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs --test --test-isolation=none lib/db/qa/usage-statistics.test.ts

      - name: Current card catalog, full engine and 100 AI matches
        run: node docs/qa/current-card-engine.mjs

      - name: Latest administrator content snapshot AI matches
        env:
          KO_QA_ADMIN_SNAPSHOT_DIR: docs/qa/snapshots/20261021-admin
          KO_QA_ADMIN_AI_REPORT: qa-results/latest-wrestler-revisions-ai-100.md
        run: |
          node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs --test --test-isolation=none artifacts/ko-game/src/game/qa/latest-admin-ai-20261013.test.ts
          node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs --test --test-isolation=none artifacts/ko-game/src/game/qa/current-content-ai-20261012.test.ts

      - name: First-entry browser regression guard
        env:
          KO_QA_ORIGIN: http://127.0.0.1:4173
          PORT: '4173'
          BASE_PATH: /
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/ko-entry-qa" playwright@1.62.1
          "$RUNNER_TEMP/ko-entry-qa/node_modules/.bin/playwright" install --with-deps chromium
          pnpm --filter @workspace/ko-game exec vite preview --config vite.config.ts --port 4173 --host 127.0.0.1 > "$RUNNER_TEMP/ko-entry-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$KO_QA_ORIGIN/" > /dev/null; then break; fi
            sleep 1
          done
          KO_QA_PLAYWRIGHT="$RUNNER_TEMP/ko-entry-qa/node_modules/playwright/index.mjs" node docs/qa/entry-browser.mjs

      - name: Quest deletion, daily completion bonus and inventory UI regressions
        env:
          KO_QA_PLAYWRIGHT: ${{ runner.temp }}/ko-entry-qa/node_modules/playwright/index.mjs
        run: node docs/qa/quest-completion-features-runner.mjs

      - name: Compiled presence, cross-tab logout and quick AI browser
        env:
          KO_QA_PLAYWRIGHT: ${{ runner.temp }}/ko-entry-qa/node_modules/playwright/index.mjs
        run: node docs/qa/site-presence-quick-ai-runner.mjs

      - name: Cosmetics two-account PvP, AI and mobile browser checks
        env:
          KO_QA_PLAYWRIGHT: ${{ runner.temp }}/ko-entry-qa/node_modules/playwright/index.mjs
        run: |
          node docs/qa/cosmetics-browser-runner.mjs
          KO_COSMETICS_DRAFT=1 node docs/qa/cosmetics-browser-runner.mjs

      - name: Quest platform desktop and mobile with clean ordinary-user sessions
        env:
          QUEST_PLAYWRIGHT_MODULE: ${{ runner.temp }}/ko-entry-qa/node_modules/playwright/index.mjs
          KO_QA_CHROME_CHANNEL: chromium
        run: node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs --test --test-isolation=none lib/db/qa/quest-platform-http.test.ts

      - name: Cinematic and shared battle browser regression guard
        env:
          KO_QA_ORIGIN: http://127.0.0.1:5173
          KO_QA_CHROME_CHANNEL: chromium
          PORT: '5173'
          BASE_PATH: /
        run: |
          pnpm --filter @workspace/ko-game exec vite --config vite.config.ts --port 5173 --host 127.0.0.1 > "$RUNNER_TEMP/ko-cinematic-qa.log" 2>&1 &
          qa_pid=$!
          trap 'kill "$qa_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$KO_QA_ORIGIN/qa/overhaul.html" > /dev/null; then break; fi
            sleep 1
          done
          export KO_QA_PLAYWRIGHT="$RUNNER_TEMP/ko-entry-qa/node_modules/playwright/index.mjs"
          # Keep failures readable through the Checks API even if blob log downloads are unavailable.
          run_browser() {
            local qa_log="$RUNNER_TEMP/$(basename "$1").log"
            if node "$@" > "$qa_log" 2>&1; then
              cat "$qa_log"
            else
              local qa_status=$?
              QA_ERROR_LOG="$qa_log" QA_ERROR_FILE="$1" node - <<'NODE'
          const fs = require('node:fs');
          const escape = value => value.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          const detail = fs.readFileSync(process.env.QA_ERROR_LOG, 'utf8').slice(-3000);
          console.log(`::error file=${process.env.QA_ERROR_FILE}::${escape(detail)}`);
          NODE
              cat "$qa_log"
              return "$qa_status"
            fi
          }
          run_browser docs/qa/combat-crash-browser.mjs
          run_browser docs/qa/entry-audio-browser.mjs
          run_browser docs/qa/legendary-audio-browser.mjs
          run_browser docs/qa/heavy-impact-browser.mjs
          run_browser docs/qa/cinematic-overhaul-browser.mjs
          run_browser docs/qa/cinematic-browser.mjs
          run_browser docs/qa/presentation-master-browser.mjs
          KO_QA_NO_REMOTE_ART=1 run_browser docs/qa/art-direction-browser.mjs
          run_browser docs/qa/ai-replay-race-browser.mjs
          KO_QA_COMPILED_CSS=1 run_browser docs/qa/mobile-history-browser.mjs
          KO_QA_COMPILED_CSS=1 run_browser docs/qa/mobile-portrait-battle-browser.mjs
          run_browser docs/qa/battle-card-info-portraits-browser.mjs
          run_browser docs/qa/latest-wrestler-revisions-browser.mjs
          run_browser docs/qa/field-attack-drag-browser.mjs
          run_browser docs/qa/mobile-deck-controls-browser.mjs
          run_browser docs/qa/deck-sharing-browser.mjs
          run_browser docs/qa/admin-session-music-browser.mjs
          run_browser docs/qa/daily-quests-browser.mjs
          run_browser docs/qa/champion-features-browser.mjs
          run_browser docs/qa/current-content-browser-20261012.mjs
          run_browser docs/qa/fusion-browser.mjs
          run_browser docs/qa/luna-active-browser.mjs
          run_browser docs/qa/machine-fusion-browser.mjs
          run_browser docs/qa/mobile-input-browser.mjs
          run_browser docs/qa/mobile-spell-drag-browser.mjs
          run_browser docs/qa/desktop-hand-browser.mjs
          run_browser docs/qa/tag-manager-browser.mjs

      - name: Full admin console navigation, saves, mobile and unsaved draft guards
        env:
          KO_ADMIN_QA_ORIGIN: http://127.0.0.1:17998
          KO_QA_PLAYWRIGHT: ${{ runner.temp }}/ko-entry-qa/node_modules/playwright/index.mjs
          KO_QA_CHROME_CHANNEL: chromium
          PORT: '17998'
          BASE_PATH: /
        run: |
          rm -f qa-results/tower-v2/fixture.json
          KO_TOWER_BROWSER_MODE=1 node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs --test --test-isolation=none lib/db/qa/tower-v2-http.test.ts > "$RUNNER_TEMP/ko-admin-fixture.log" 2>&1 &
          fixture_pid=$!
          pnpm --filter @workspace/ko-game exec vite --config vite.config.ts --port 17998 --host 127.0.0.1 > "$RUNNER_TEMP/ko-admin-preview.log" 2>&1 &
          admin_pid=$!
          trap 'kill "$fixture_pid" "$admin_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if test -f qa-results/tower-v2/fixture.json && curl --fail --silent "$KO_ADMIN_QA_ORIGIN/admin" > /dev/null; then break; fi
            sleep 1
          done
          run_admin_browser() {
            local qa_log="$RUNNER_TEMP/$(basename "$1").log"
            if node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs "$@" > "$qa_log" 2>&1; then
              cat "$qa_log"
            else
              local qa_status=$?
              QA_ERROR_LOG="$qa_log" QA_ERROR_FILE="$1" node - <<'NODE'
          const fs = require('node:fs');
          const escape = value => value.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          const detail = fs.readFileSync(process.env.QA_ERROR_LOG, 'utf8').slice(-3000);
          console.log(`::error file=${process.env.QA_ERROR_FILE}::${escape(detail)}`);
          NODE
              cat "$qa_log"
              return "$qa_status"
            fi
          }
          run_admin_browser docs/qa/admin-console-menus-browser.mjs
          run_admin_browser docs/qa/admin-console-editors-browser.mjs
          run_admin_browser docs/qa/admin-console-guard-browser.mjs

      - name: Usage statistics real administrator UI on desktop and mobile
        env:
          KO_STATS_QA_ORIGIN: http://127.0.0.1:17999
          KO_QA_CHROME_CHANNEL: chromium
          PORT: '17999'
          BASE_PATH: /
        run: |
          rm -f qa-results/usage-statistics/fixture.json
          KO_STATS_BROWSER_MODE=1 node --import ./docs/qa/checkpoints/20261006/qa-loader.mjs --test --test-isolation=none lib/db/qa/usage-statistics.test.ts > "$RUNNER_TEMP/ko-usage-fixture.log" 2>&1 &
          fixture_pid=$!
          pnpm --filter @workspace/ko-game exec vite --config vite.config.ts --port 17999 --host 127.0.0.1 > "$RUNNER_TEMP/ko-usage-vite.log" 2>&1 &
          usage_pid=$!
          trap 'kill "$fixture_pid" "$usage_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if test -f qa-results/usage-statistics/fixture.json && curl --fail --silent "$KO_STATS_QA_ORIGIN/admin" > /dev/null; then break; fi
            sleep 1
          done
          export KO_QA_PLAYWRIGHT="$RUNNER_TEMP/ko-entry-qa/node_modules/playwright/index.mjs"
          if ! node docs/qa/usage-statistics-browser.mjs > "$RUNNER_TEMP/ko-usage-browser.log" 2>&1; then
            cat "$RUNNER_TEMP/ko-usage-browser.log"
            QA_ERROR_LOG="$RUNNER_TEMP/ko-usage-browser.log" node - <<'NODE'
          const fs=require('node:fs');
          const detail=fs.readFileSync(process.env.QA_ERROR_LOG,'utf8').slice(-3000).replaceAll('%','%25').replaceAll('\r','%0D').replaceAll('\n','%0A');
          console.log(`::error file=docs/qa/usage-statistics-browser.mjs::${detail}`);
          NODE
            exit 1
          fi
          cat "$RUNNER_TEMP/ko-usage-browser.log"
