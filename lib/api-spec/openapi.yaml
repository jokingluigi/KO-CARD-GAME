openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /daily-quests/ai-match-progress:
    post:
      operationId: completeAIMatchQuestProgress
      tags: [daily-quests]
      summary: Validate a completed local AI match and apply its Quest progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIMatchQuestProgressInput"
      responses:
        "200":
          description: Canonical match events were applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIMatchQuestProgressResponse"
        "400":
          description: Invalid match transcript
        "401":
          description: Authentication required
        "422":
          description: Match is invalid or cannot be completed
  /packs/{id}/open-bulk:
    post:
      operationId: openBulkPack
      tags: [packs]
      summary: Open multiple packs atomically
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkPackOpenInput"
      responses:
        "200":
          description: Pack openings, committed together
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkPackOpenResponse"
        "400":
          description: Invalid quantity or missing idempotency key
        "409":
          description: Idempotency key conflicts with a different request
        "422":
          description: Pack inventory is insufficient or the pack cannot be opened
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AIMatchQuestProgressInput:
      type: object
      properties:
        deckId:
          type: string
          minLength: 1
        aiDeckId:
          type: string
          minLength: 1
        matchId:
          type: string
          minLength: 1
          maxLength: 64
        actions:
          type: array
          maxItems: 2000
          items:
            type: object
            additionalProperties: true
      required: [deckId, aiDeckId, matchId, actions]
      additionalProperties: false
    AIMatchQuestProgressResponse:
      type: object
      properties:
        completed:
          type: boolean
      required: [completed]
      additionalProperties: false
    BulkPackOpenInput:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 100
      required: [quantity]
      additionalProperties: false
    BulkPackOpenResponse:
      type: object
      properties:
        quantity:
          type: integer
        openings:
          type: array
          items:
            $ref: "#/components/schemas/PackOpening"
      required: [quantity, openings]
    PackOpening:
      type: object
      properties:
        rewards:
          type: array
          items:
            $ref: "#/components/schemas/PackReward"
      required: [rewards]
    PackReward:
      type: object
      properties:
        rewardType:
          type: string
          enum: [NORMAL_CARD, LEGENDARY_CARD, CHAMPION_UNLOCK, SKIN]
      required: [rewardType]
      additionalProperties: true

